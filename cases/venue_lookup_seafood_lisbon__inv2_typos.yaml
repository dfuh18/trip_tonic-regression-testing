notes: 'The catalogue''s only INV-2, and deliberately only one (D61). A typo is a weak perturbation wherever
  the text is read by the model alone - that is what language models are good at, and a suite full of
  them would report its own insensitivity as coverage. It is NOT weak here, which is why this is the seed
  that takes it: a venue lookup''s words become a search_places QUERY ARGUMENT, so ''sodre'' and ''seafod''
  are handed to the Places API rather than merely understood. This is the one place in the suite where
  a typo can reach past the model and degrade an answer on its own.


  The perturbation is what a phone actually produces: transpositions (''palces''), a dropped letter (''seafod'',
  ''nothin'', ''god''), lost casing and a dropped diacritic (''Cais do Sodre''). The last is the load-bearing
  one - the accent is on the anchor the case measures distance from, and places_near is inherited unchanged
  at 3km, so an agent that searches for the wrong place fails on location rather than on taste.


  Every seed check is inherited without amendment, which is what makes this an invariance claim. The fifth
  criterion is the only addition and it is not a weakening: answering a misspelt question by querying
  the spelling is a failure a human would notice and the structural checks would not.


  If it passes at 8/8, that IS the finding, and the honest way to report the relation is as one the agent
  is insensitive to - which is worth more than omitting the relation and leaving a reader to wonder whether
  it was tried.'
