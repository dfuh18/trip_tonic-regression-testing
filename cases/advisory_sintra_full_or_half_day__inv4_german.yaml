notes: 'The language switch, which no other case in the suite uses. It replaced a typo perturbation of
  this same seed, and the reason is that the typo case and its sibling paraphrase tested one property
  between them - tolerance to how the sentence is written - so a single robustness regression would break
  both and the pair would buy one finding for eight executions. A language switch tests what the paraphrase
  cannot: whether the agent answers in the member''s language, and whether it still reaches the trip''s
  own state to refer to Pena Palace when the request is not in English. The cost, stated: the judge scores
  a German reply against English criteria, which the criteria are worded to survive. Structurally this
  case is its seed: the same tools run, the same nothing is written, and what changed is the content of
  the answer. Its structural verdict is inherited and will read ''none'' whether or not the agent answered
  the new question - only the judge sees the delta. That is where structural verification stops and scoring
  starts, and it is said here because a reader meeting ''none'' in a failure report would otherwise believe
  something was checked.'
