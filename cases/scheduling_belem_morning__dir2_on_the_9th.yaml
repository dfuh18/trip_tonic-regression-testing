user_profile: Ines, 29, the organiser of the group. Wants a plan she can accept stop by stop, writes full
  sentences, names a day by its date the way people do — "the 7th", never a full calendar string.
goal: 'Get a draft for the morning of the 9th in Belem with two or three stops, so the group can settle
  them one by one. She is satisfied as soon as a draft for that morning exists: she settles the individual
  stops herself on the itinerary rather than asking Tonic to revise it, and if Tonic offers anything further
  she says that is all she needed.'
