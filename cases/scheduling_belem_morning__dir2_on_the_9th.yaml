scoring_criteria:
- Summarises the morning in a few sentences and makes clear it is Belem, on the 9th, without reciting
  every stop back.
- Gives a reason each stop belongs in this morning rather than listing them flat.
- Treats the monastery as a stop the trip already has rather than as a new find.
- 'Sequences the stops so the morning is walkable: things near each other are near each other in the plan.'
