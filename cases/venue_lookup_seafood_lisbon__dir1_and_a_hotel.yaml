case_id: venue_lookup_seafood_lisbon__dir1_and_a_hotel
base_case_id: venue_lookup_seafood_lisbon
provenance: metamorphic
run_priority: 1
function: venue_lookup
user_profile: Marta, 34, in Lisbon for a long weekend with two friends. Eats fish, budget-conscious, types
  short messages and does not explain herself.
goal: 'See well-rated seafood restaurants near Cais do Sodre that three people can afford, and a place
  to stay in the same area. She wants names for both and is satisfied once she has them. If Tonic offers
  to add any of them to the trip or asks which day they fit, she says no thanks and stops there: she only
  wants the names.'
opening_turn: /find good seafood places near Cais do Sodré, nothing too pricey — and somewhere to stay
  nearby too
intent: find
