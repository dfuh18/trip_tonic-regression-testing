case_id: venue_lookup_sintra_lunch
base_case_id: null
provenance: seeded
run_priority: 1
function: venue_lookup
user_profile: Tom, 41, travelling with his partner. Likes a proper sit-down lunch, says which day he means
  the way people do — by what is on it.
goal: 'See lunch places near Pena Palace for the Sintra day that are not tourist traps. He wants somewhere
  to consider and is satisfied once he has the names. If Tonic offers to add any of them to the trip or
  asks which day they fit, he says no thanks and stops there: he only wants the names.'
opening_turn: /find where should we eat lunch on the Sintra day? somewhere near the palace, proper local
  food
intent: find
expected_tool_sequence:
- search_places
declared_constraints:
  checks:
    tool_counts:
      search_places:
        min: 1
        max: 4
    places_surfaced:
      min: 1
    mutation_counts:
      trip_blocks.INSERT: 0
      itinerary_slots.INSERT: 0
      itinerary_slots.UPDATE: 0
      ai_suggestions.INSERT: 0
    tool_errors: none
    turn_errors: none
    places_named:
      min: 2
    trip_after:
      blocks: fixture
      slots: fixture
    places_near:
      anchor: Pena Palace
      within_km: 8
  predicates: []
scoring_criteria:
- Names at least two places in or near Sintra, not back in Lisbon.
- Works out which day is meant instead of asking, and answers for the Sintra day.
- Answers the 'local food' cue with something specific.
- Places each one by a neighbourhood or a landmark, so they can be told apart on a map.
repetitions_n: 8
metamorphic_relation: null
fixture_depends_on:
- Pena Palace
- '2026-11-08'
notes: 'Minimum functionality for venue lookup where the member leaves the day implicit. "The Sintra day"
  is a day only because of what the itinerary holds, so the agent has to resolve it against the trip before
  it can search at all. That the search stays in Sintra rather than drifting back to Lisbon is scored
  by the judge and not checked: the agent''s wrong-region guard is a continent-scale sanity check measured
  to the nearest trip anchor, so a Lisbon restaurant sits comfortably inside it and the guard would catch
  nothing here. search_places is bounded at one to three calls, because the agent may search once per
  constraint the member gave, or re-query after a thin result set; places_named then requires the reply
  to have used what came back, which places_surfaced alone does not. Nothing is written, and the goal
  ends by declining the offer to schedule, because the agent''s find-mode instruction requires it to make
  that offer and a persona who accepted would make a correct agent write a draft on the next turn and
  fail the mutation zeros. The criteria say "at least two" rather than a range because the agent is separately
  instructed to offer three to five options. Which places it finds is not asserted (D32): the case requires
  lunch in the right region, not a venue the author picked. The reference tools are permitted by /find
  at the API level and forbidden here by absence (D28), deliberately: this request is answered by searching,
  and permitting an article lookup would stop the case noticing an agent that reached for one instead.
  turn_errors and trip_after arrived with the derivation of the check vocabulary from the event model
  (D37). turn_errors says the turn finished: an empty reply comes back as HTTP 200, so the simulator answers
  it in character and every other check here passes against a trip nothing touched. trip_after states
  the same read-only claim as a post-state rather than as four zeros, so it holds whether or not the mutation
  trigger fired - two independent ways for the same fact to be wrong. places_near anchors the answer geographically:
  the criterion ''in or near Sintra, not back in Lisbon'' was judge-scored only, and a venue set can differ
  from another while still being in the wrong town. Pena Palace and Baixa are 23.5 km apart, so 8 km covers
  the Sintra area generously and excludes Lisbon outright. It is not the application''s VENUE_SANITY_KM
  of 300, which exists to catch Lisbon-versus-Porto and would pass everything this check is for.'
