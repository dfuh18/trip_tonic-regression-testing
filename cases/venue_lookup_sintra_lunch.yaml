notes: 'Minimum functionality for venue lookup where the member leaves the day implicit. "The Sintra day"
  is a day only because of what the itinerary holds, so the agent has to resolve it against the trip before
  it can search at all. The search then has to land in the trip''s second region rather than in Lisbon,
  which is where the wrong-region guard earns its keep. search_places is bounded at one to three calls:
  one per constraint the member gave, or a re-search after the region guard drops a result. Nothing is
  written.'
