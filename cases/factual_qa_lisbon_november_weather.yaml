notes: 'Minimum functionality for factual question answering where more than one source is legitimate.
  get_region_climate and get_climate_normals both answer a typical-November question honestly, so tools_any_of
  carries the constraint and expected_tool_sequence is empty: the case requires a source, not a particular
  one. Both are stored as references, and the criteria are worded to be true of either - the two disagree
  by a few tenths of a degree, and a reply should not be marked down for having used the other one. get_weather
  is permitted but does not satisfy the case: it is a sixteen-day forecast and cannot reach the trip''s
  month, so an agent that answered from it would be answering about the wrong weeks - but one that tries
  it, finds it does not reach November and falls back has done nothing wrong, and forbidding the probe
  outright would fail it. That is what the zero-minimum count in tool_counts says, and why tools_any_of
  does not name it. Judged against stored climate data rather than a retrieved forecast, because D23 sends
  a day-by-day weather question to the forecast the agent fetched, and "usually, in November" is a climate
  question. The message carries no slash command, so the mutation zeros are a real constraint.'
