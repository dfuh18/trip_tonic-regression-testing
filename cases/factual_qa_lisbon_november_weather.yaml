notes: 'Minimum functionality for factual question answering where more than one source is legitimate.
  get_region_climate and get_climate_normals both answer a typical-November question honestly, so tools_any_of
  carries the constraint and expected_tool_sequence is empty: the case requires a source, not a particular
  one. Both are stored as references and the criteria are worded to hold for either, because the two do
  not agree exactly - they differ by a few tenths of a degree on the November temperatures, and they differ
  about rank as well, the Wikipedia table making November the wettest month while the three-year normals
  put it second to January by daily precipitation. That is why the second criterion says "among the wettest"
  rather than "the wettest", which either source would have to contradict. get_weather is permitted at
  up to one call and cannot satisfy the case: it is a sixteen-day forecast and cannot reach the trip''s
  month, so an agent that answered from it would be answering about the wrong weeks. Trying it is not
  the failure - the failure is staying there. tool_errors is "corrected" rather than "none" for exactly
  this path (D33): asking the forecast endpoint for a date seven weeks out returns an error, and an agent
  that reads that, recognises it used the wrong function for the question and calls a climate tool instead
  has done the right thing twice. An error it does not correct still fails, so the case permits the recovery
  without permitting the mistake. Judged against stored climate data rather than a retrieved forecast,
  because D23 sends a day-by-day weather question to the forecast the agent fetched, and "usually, in
  November" is a climate question. The goal ends by declining an offer to schedule, and the reason is
  narrower than it looks: the free-text instruction scopes its closing offer to requests that ask purely
  for ideas, and says in the same breath that informational questions are answered without a draft - so
  this request is not supposed to attract the offer at all. The clause is insurance against the agent
  making it anyway, which costs nothing, rather than a guard against behaviour the prompt requires. turn_errors
  and trip_after arrived with the derivation of the check vocabulary from the event model (D37). turn_errors
  says the turn finished: an empty reply comes back as HTTP 200, so the simulator answers it in character
  and every other check here passes against a trip nothing touched. trip_after states the same read-only
  claim as a post-state rather than as four zeros, so it holds whether or not the mutation trigger fired
  - two independent ways for the same fact to be wrong.'
