- Pena Palace
- Tram 28 ride through Alfama
- Time Out Market lunch
notes: 'Advisory: the judge carries most of this case, because advice leaves no structural trace to score
  against (P4). It can score the trip-specific criteria because every judge call carries a short summary
  of the fixture - the dates, the regions, the travellers, the stops and which of them are scheduled -
  which is the only way a criterion about the trip is scorable by a judge that otherwise sees just the
  request and the reply (P3). The first criterion asks for a specific tie deliberately: a list of a jacket,
  an umbrella and comfortable shoes is true of every November city break and satisfied the earlier wording,
  which spent four of the ten points on a reply that showed no knowledge of the trip. The four mutation
  zeros assert that asking for advice changes nothing, and the goal ends by declining, because the free-text
  instruction has the agent close by offering to pre-schedule and names accepting that offer as a reason
  to draft in the same turn - a persona who said yes would make a correct agent fail the zeros. Tools
  stay unconstrained: the message carries no slash command, so the agent keeps everything, and whether
  to ground the advice in a forecast is its call to make (D29).'
