function: advisory
user_profile: Marta, 34, packing this week, wants a checklist she can act on.
goal: A sensible packing list for four days in Lisbon and Sintra in November. She wants the list; if Tonic
  offers to change anything on the trip she says no thanks.
opening_turn: '@Tonic what should the three of us pack for this trip?'
intent: null
expected_tool_sequence: []
declared_constraints:
  checks:
    mutation_counts:
      trip_blocks.INSERT: 0
      itinerary_slots.INSERT: 0
      itinerary_slots.UPDATE: 0
      ai_suggestions.INSERT: 0
  predicates: []
scoring_criteria:
- Ties at least one item to something specific about this trip - the Sintra hills, the cobbled streets,
  or November rain - rather than reading as a generic city-break list.
- 'Fits the season and the places in the summary: November, Lisbon and Sintra, a day at a hilltop palace.'
- Names specific items rather than describing categories.
- Writes for the group rather than for one traveller.
repetitions_n: 8
metamorphic_relation: null
