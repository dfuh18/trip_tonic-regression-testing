notes: 'Advisory: the judge carries most of this case, because advice leaves no structural trace to score
  against (P4). It can score "fits this trip" because every judge call carries a short summary of the
  fixture - the dates, the regions, the travellers, the stops and which of them are scheduled - which
  is the only way a criterion about the trip is scorable by a judge that otherwise sees just the request
  and the reply (P3). The four mutation zeros assert that asking for advice changes nothing, which is
  what the request implies. Tools stay unconstrained: the message carries no slash command, so the agent
  keeps everything, and whether to ground the advice in a forecast is its call to make (D29).'
