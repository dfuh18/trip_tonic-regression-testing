case_id: scheduling_move_tram__dir4_off_the_itinerary
base_case_id: scheduling_move_tram
provenance: metamorphic
run_priority: 1
function: scheduling
user_profile: 'Ines, 29, the organiser. Direct, and says when she means the way people do: a weekday and
  a rough time.'
goal: Take the Tram 28 ride off the itinerary entirely - not moved to another day, removed. The stop should
  stay saved in the trip; she may still want it later. Once it is off she is done; if Tonic offers to
  put it somewhere else or to fill the freed Friday morning, she says no thanks.
opening_turn: /reschedule can you take the tram ride off the itinerary?
intent: reschedule
expected_tool_sequence:
- unschedule_block
declared_constraints:
  checks:
    tool_counts:
      unschedule_block:
        min: 1
        max: 2
      get_weather:
        min: 0
        max: 1
    tool_errors: corrected
    turn_errors: none
    edits:
      unschedule:
        min: 1
        max: 1
      move: 0
      schedule: 0
    mutation_counts:
      trip_blocks.INSERT: 0
      itinerary_slots.INSERT: 0
      itinerary_slots.UPDATE: 0
      ai_suggestions.INSERT: 0
    trip_after:
      blocks: fixture
      slots: 2
    slot_unscheduled:
      block: Tram 28 ride through Alfama
  predicates: []
scoring_criteria:
- Confirms the tram ride is off the itinerary, in one short confirmation.
- Makes clear the stop is still saved in the trip rather than deleted.
- Does not silently move it somewhere else instead of removing it.
references: []
repetitions_n: 4
metamorphic_relation: DIR-4
fixture_depends_on:
- Tram 28 ride through Alfama
- '2026-11-06'
- '2026-11-07'
notes: 'A negation of the seed - not moved, removed - and the only case that exercises unschedule_block,
  which no case named and no execution called before it. trip_after carries the claim that matters: one
  slot fewer and the same number of stops, which is how an agent that deletes the stop instead of unscheduling
  it is caught. itinerary_slots.DELETE is deliberately not asserted - the mutation trigger''s coverage
  of deletes is not something this case should be the first to depend on, and the edits journal plus trip_after
  already say the slot went.'
