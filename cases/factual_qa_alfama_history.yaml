notes: 'Minimum functionality for factual question answering: read the article, answer from it. tools_any_of
  rather than a count, and expected_tool_sequence is empty, because one tool constrains no order and naming
  it twice would be two places to keep in step; how often the agent reads in order to answer well is not
  the case''s business, while whether it read at all is. The stored reference is what read_wikipedia(''Alfama'')
  returns verbatim - the whole article, which is under the tool''s six-thousand-character cap - so every
  fact the first criterion asks for is text the agent actually had, including the etymology, which sits
  in the lead and not in the History section. Agreement and coverage are two criteria rather than one,
  because the tool takes an optional section argument and read_wikipedia(''Alfama'', ''History'') returns
  a section that does not carry the etymology - so a brief, accurate answer drawn from it can satisfy
  agreement completely while covering two of the four facts, and a single criterion demanding all four
  would have forced the essay the brevity criterion forbids. Agreement is worded as what the reference
  contradicts rather than what it supports, so a true fact the agent knows and the article happens not
  to carry is not punished - and so that the criterion says the same thing as the judge''s own instruction,
  which is to count a contradicted claim against a reply and neither reward nor punish what it cannot
  check. The goal ends by declining an offer to schedule: this message carries no slash command, so the
  agent holds every tool from the first turn and the free-text instruction names accepting an offer as
  a reason to draft, which would fail the mutation zeros on a question about a neighbourhood''s history.
  The message carries no slash command, which has two consequences worth reading a failure against. The
  four mutation zeros are a real constraint here rather than a restatement of the tool policy, because
  the agent keeps its whole toolset and could draft or schedule if it chose to. And the tool constraint
  binds that same free-text turn: a search for a fado bar to go with the answer is a structural failure
  even though nothing forbade the tool at the API level, so a failure report naming an unexpected tool
  here is not evidence of a missing slash command.'
