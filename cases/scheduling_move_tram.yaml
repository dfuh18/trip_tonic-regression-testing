case_id: scheduling_move_tram
base_case_id: null
provenance: seeded
run_priority: 1
function: scheduling
user_profile: 'Ines, 29, the organiser. Direct, and says when she means the way people do: a weekday and
  a rough time.'
goal: Move the Tram 28 ride off Friday morning to Saturday afternoon, around four.
opening_turn: /reschedule can you move the tram ride to Saturday afternoon instead? around 4
intent: reschedule
expected_tool_sequence:
- move_slot
declared_constraints:
  checks:
    tool_counts:
      move_slot:
        min: 1
        max: 2
    slot_moved:
      block: Tram 28 ride through Alfama
      day: '2026-11-07'
      start_time: '16:00'
      end_time: '17:00'
    mutation_counts:
      trip_blocks.INSERT: 0
      itinerary_slots.INSERT: 0
      itinerary_slots.UPDATE: 1
      ai_suggestions.INSERT: 0
  predicates: []
scoring_criteria:
- 'States exactly what changed: the stop, the new day and the new time.'
- Does not ask which stop or which Saturday was meant; the trip has one of each.
- Says the change is now on the shared itinerary, or that it can be undone.
repetitions_n: 8
metamorphic_relation: null
fixture_depends_on:
- Tram 28 ride through Alfama
- '2026-11-06'
- '2026-11-07'
notes: 'Minimum functionality for a live edit. The member says "Saturday" and "around 4", which is how
  people name a time, so resolving those to 2026-11-07 and 16:00 is part of what is tested and slot_moved
  asserts the resolved values rather than the words. end_time is asserted too: the stop is an hour long,
  and a move that sets the start but leaves the end where it was would land it in the right window and
  still be wrong. The case measures the itinerary ending up right rather than getting there in one call
  - move_slot may run twice and no_tool_errors is deliberately absent, because moving a slot later without
  also moving its end is refused by the API (the stored end would precede the new start) and an agent
  that retries with both is behaving correctly. How often that retry happens is reported in the analysis
  from the trace, so first-try success stays visible without being a pass criterion. move_slot is the
  only tool named, so every other tool is forbidden by being absent (D28). itinerary_days.INSERT is deliberately
  not asserted: the 7th is an empty day in the fixture, so moving a stop onto it legitimately creates
  the day row, and a count would encode which days the fixture happens to have rather than anything about
  the agent.'
