case_id: scheduling_move_tram
base_case_id: null
provenance: seeded
run_priority: 1
function: scheduling
user_profile: 'Ines, 29, the organiser. Direct, and says when she means the way people do: a weekday and
  a rough time.'
goal: Move the Tram 28 ride off Friday morning to Saturday afternoon, around four. Once it has moved she
  is done; if Tonic offers to fill the freed Friday morning or to add anything else, she says no thanks.
opening_turn: /reschedule can you move the tram ride to Saturday afternoon instead? around 4
intent: reschedule
expected_tool_sequence:
- move_slot
declared_constraints:
  checks:
    tool_counts:
      move_slot:
        min: 1
        max: 2
      get_weather:
        min: 0
        max: 1
    slot_moved:
      block: Tram 28 ride through Alfama
      day: '2026-11-07'
      starts_between:
      - '15:30'
      - '16:30'
      duration_minutes:
        min: 45
        max: 90
      clear_of_other_slots: true
    mutation_counts:
      trip_blocks.INSERT: 0
      itinerary_slots.INSERT: 0
      itinerary_slots.UPDATE:
        min: 1
        max: 2
      ai_suggestions.INSERT: 0
    tool_errors: corrected
    turn_errors: none
    edits:
      move:
        min: 1
        max: 2
      unschedule: 0
      schedule: 0
    mutation_changed_keys:
      itinerary_slots.UPDATE:
      - itinerary_day_id
      - start_time
      - end_time
      - end_day_date
      - time_precision
    trip_after:
      blocks: fixture
      slots: fixture
  predicates: []
scoring_criteria:
- 'States exactly what changed: the stop, the new day and the new time.'
- Does not silently move or drop anything else on either day.
- Reads as one short confirmation, not a re-listing of the itinerary.
repetitions_n: 8
metamorphic_relation: null
fixture_depends_on:
- Tram 28 ride through Alfama
- '2026-11-06'
- '2026-11-07'
notes: 'Minimum functionality for a live edit. The member says "Saturday" and "around 4", which is how
  people name a time, so resolving those against the trip is part of what is tested and slot_moved asserts
  the resolved values rather than the words. It asserts them as a range, because "around 4" is one: 15:30
  to 16:30 is what the phrase licenses, and an agent writing 16:15 has understood the request (D31). The
  day carries no tolerance - the trip has one Saturday and an agent on another day is wrong. The stop
  is named exactly, which is the one place a case does name a particular place (D32): the member pointed
  at it, so any other stop landing in that window is a different answer to a different question. Length
  is asserted separately at 45 to 90 minutes, which brackets the 60 the fixture gives this slot: move_slot
  takes the end time as an optional argument and nothing derives it from the stop''s duration, so an agent
  that sets the start and leaves the stored end alone turns an hour into a stop running to the end of
  the day, and no assertion about the start would notice. clear_of_other_slots is true although the 7th
  is empty in the fixture, so that the case keeps meaning what it says if a stop is ever added to that
  day. tool_errors is "corrected" rather than "none": moving a slot later without also moving its end
  is refused by the API before anything is written (the stored end would precede the new start), and an
  agent that retries with both is behaving correctly (D30, D33). move_slot may therefore run twice, and
  itinerary_slots.UPDATE allows two for a second reason - moving the day first and the time second is
  two legal successful calls and two real writes, which a count of one would fail. How often either happens
  is reported in the analysis from the trace, so first-try success stays visible without being a pass
  criterion. move_slot is the only tool named, so every other tool is forbidden by being absent (D28)
  - and that is a deliberate assertion about the route, not only the outcome: /reschedule also permits
  unschedule_block then schedule_block, which reaches the same end state, and the case rejects it because
  the agent''s own instruction is to prefer moving over unscheduling and because that path would write
  an INSERT the zeros forbid. The goal ends by declining an offer, which will read as redundant to anyone
  who has not traced the toolset: the reschedule instruction forbids asking before editing but not a closing
  offer, and the next turn carries no slash command, so propose_plan is available again and the free-text
  instruction names accepting an offer as a reason to draft in that same turn. get_weather is permitted
  at up to one call for the same reason its sibling permits it: /reschedule keeps the reference tools,
  and the standing instruction to check conditions during the trip dates is not scoped to a mode, so an
  agent that looks before moving an outdoor ride to a November afternoon is following its instructions.
  Forbidding it here while permitting it there would have been two answers to one question. Nothing else
  is permitted: no search, no draft, no unschedule. itinerary_days.INSERT is deliberately not asserted:
  the 7th is an empty day in the fixture, so moving a stop onto it legitimately creates the day row, and
  a count would encode which days the fixture happens to have rather than anything about the agent. Three
  keys arrived with the derivation of the check vocabulary from the event model (D37). edits is the agent''s
  own journal of the move, beside itinerary_slots.UPDATE which is the database''s: an edit journalled
  but not written, or written but not journalled, is a fault and neither signal sees it alone. mutation_changed_keys
  is the ''and nothing else'' - a move may touch the day, the two times, the span and the precision, and
  one that also clears the lock or re-points the slot at another stop has done something nobody asked
  for. trip_after says the move moved rather than added. turn_errors says the turn finished at all.'
