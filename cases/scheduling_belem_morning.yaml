case_id: scheduling_belem_morning
base_case_id: null
provenance: seeded
run_priority: 1
function: scheduling
user_profile: Ines, 29, the organiser of the group. Wants a plan she can accept stop by stop, writes full
  sentences, names a day by its date the way people do — "the 7th", never a full calendar string.
goal: 'Get a draft for the morning of the 7th in Belem with two or three stops, so the group can settle
  them one by one. She is satisfied as soon as a draft for that morning exists: she settles the individual
  stops herself on the itinerary rather than asking Tonic to revise it, and if Tonic offers anything further
  she says that is all she needed.'
opening_turn: /plan can you put together a Belém morning for the 7th? two or three stops, we already have
  the monastery saved
intent: plan
expected_tool_sequence:
- search_places
- propose_plan
declared_constraints:
  checks:
    tool_counts:
      search_places:
        min: 1
        max: 4
      propose_plan:
        min: 1
        max: 2
      get_weather:
        min: 0
        max: 1
    slot_days:
    - '2026-11-07'
    slot_count:
      min: 2
      max: 4
    mutation_counts:
      trip_blocks.INSERT: 0
      itinerary_slots.INSERT: 0
      itinerary_slots.UPDATE: 0
      ai_suggestions.INSERT:
        min: 1
        max: 2
    tool_errors: corrected
    turn_errors: none
    draft_reuses_blocks:
    - Jerónimos Monastery
    places_surfaced:
      min: 1
    draft_slot_starts_between:
    - 07:00
    - '13:00'
    trip_after:
      blocks: fixture
      slots: fixture
  predicates: []
scoring_criteria:
- Summarises the morning in a few sentences and makes clear it is Belem, on the 7th, without reciting
  every stop back.
- Gives a reason each stop belongs in this morning rather than listing them flat.
- Treats the monastery as a stop the trip already has rather than as a new find.
- 'Sequences the stops so the morning is walkable: things near each other are near each other in the plan.'
repetitions_n: 8
metamorphic_relation: null
fixture_depends_on:
- Jerónimos Monastery
- '2026-11-07'
notes: 'Minimum functionality for drafting. The member writes the date as "the 7th", which is how people
  write one, so resolving it against the trip''s dates is part of what is tested - and slot_days is the
  check that tests it, read from the propose_plan call''s own arguments in the trace, because the recorded
  state shape carries counts and no dates. draft_slot_starts_between reads the same arguments and is the
  check that tests the other half of the request: she asked for a morning, the drafting tool instructs
  the reply not to repeat every slot, so without it an afternoon described as a morning passes and the
  criterion about the times the reply names is vacuous exactly when it is needed. expected_tool_sequence
  carries the grounding and the order, search before propose, and places_surfaced carries what the order
  alone cannot: that the search actually returned something, so a draft of recalled venues after an empty
  search fails rather than passing on the sequence (P5). The mutation counts say that a draft is a proposal:
  nothing reaches the live itinerary until a member accepts. propose_plan and ai_suggestions.INSERT permit
  two rather than one, because a member may accept a revision within the turn cap and every propose_plan
  call inserts a new row; the goal then says when she is satisfied, because three legal revisions inside
  the three-turn cap would fail a bound that exists for a different reason. slot_count allows four because
  "two or three stops, we already have the monastery saved" reads both as two or three including it and
  as two or three besides it, and the third criterion actively encourages reusing it. draft_reuses_blocks
  names the monastery, and that is not a breach of the rule against naming venues but its exception (D32):
  the member said the trip already has it, so that stop is hers to name, and a draft that ignores it and
  finds its own Belem monument has answered a different request. Which OTHER stops fill the morning is
  asserted nowhere, because that is the agent''s judgement and the author''s taste is not a pass criterion.
  get_weather is permitted at up to one call with tool_errors "corrected": /plan keeps the reference tools
  and the standing prompt tells the agent to check conditions during the trip dates, so looking before
  drafting an outdoor morning is reasonable. The call fails - the forecast endpoint refuses a date outside
  its sixteen-day window - and the correction available is to abandon it, which is what "corrected" means
  for a probe (D33): the tool is capped at one call, so there is no retry, and the case asserts that the
  draft does not lean on what the failed call did not return. An agent that treats the error as an answer
  fails on the draft''s own checks. ai_suggestions.UPDATE is deliberately not asserted, because propose_plan
  backfills plan_thread_id once the insert returns the id and expires a previous pending draft, both implementation
  details a refactor may remove without changing anything the member sees. turn_errors and trip_after
  arrived with the derivation of the check vocabulary from the event model (D37). turn_errors says the
  turn finished rather than returning an empty reply with HTTP 200, which the simulator would answer in
  character and no other check here would notice. trip_after says the draft stayed a draft: a proposal
  writes no stop and no slot onto the live trip, which the mutation zeros claim from the trigger''s side
  and this claims from the trip''s. The morning window ends at 13:00 rather than 12:00 (D42). The first
  full seed run drafted Pasteis 09:00, the monastery 10:00-12:00 and Belem Tower 12:15-13:15 - a good
  morning that runs into lunch, failed by fifteen minutes. The check is kept because without it a draft
  of an afternoon called a morning passes: the drafting tool tells the reply not to repeat every slot,
  so a scoring criterion about the times the reply names is vacuous exactly when it is needed. Only the
  boundary moved, and an afternoon draft still fails it.'
