notes: 'Advisory, and a question asking for a position rather than a list: the reply has to come down
  on one side and say why, which is the thing worth scoring and the criterion a bland reply genuinely
  fails. The judge carries the case, because advice leaves no structural trace (P4); it can score the
  second criterion because every judge call carries a short summary of the fixture, which is where Pena
  Palace and its day come from. The member asks for a recommendation and not a change, so the four mutation
  zeros assert that nothing is written. Tools stay unconstrained: the message carries no slash command,
  so which sources inform the recommendation is the agent''s call (D29). The goal ends by declining an
  offer to schedule, and the reason is narrower than it looks: the free-text instruction scopes its closing
  offer to requests that ask purely for ideas, and says in the same breath that informational questions
  are answered without a draft - so this request is not supposed to attract the offer at all. The clause
  is insurance against the agent making it anyway, which costs nothing, rather than a guard against behaviour
  the prompt requires.'
