scoring_criteria:
- Answers day by day rather than with a single summary figure.
- Gives both a temperature and some sense of rain for each day.
- Presents it as a forecast for the coming days, not as a typical or average month.
- Answers about the next few days, and does not drift into the trip's own dates.
